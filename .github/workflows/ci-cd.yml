name: CI-CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Lint, test and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --coverage
      - name: Dependency audit
        run: npm audit --audit-level=high

  build-scan-push:
    name: Build, scan and push ${{ matrix.service }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: [gateway, users, orders, payments]
    steps:
      - uses: actions/checkout@v4
      - name: Normalize image owner
        id: image
        shell: bash
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          build-args: SERVICE=${{ matrix.service }}
          tags: ghcr.io/${{ steps.image.outputs.owner }}/gitops-shop-${{ matrix.service }}:${{ github.sha }}
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.image.outputs.owner }}/gitops-shop-${{ matrix.service }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Push scanned image to GHCR
        shell: bash
        run: |
          IMAGE="ghcr.io/${{ steps.image.outputs.owner }}/gitops-shop-${{ matrix.service }}"
          docker tag "$IMAGE:${GITHUB_SHA}" "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"

  update-config:
    name: Update staging GitOps image tags
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-scan-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/capstone2-config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: config
      - name: Update staging image tags
        shell: bash
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          FILE="config/apps/staging/kustomization.yaml"
          sed -i -E "s|(newTag: ).*|\\1${SHA}|" "$FILE"
          cd config
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/staging/kustomization.yaml
          if git diff --cached --quiet; then
            echo "No staging image changes."
            exit 0
          fi
          git commit -m "chore(staging): deploy ${SHA}"
          git push
